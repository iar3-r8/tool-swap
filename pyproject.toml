[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-swap"
version = "0.1.0"
description = "A tool swapping router for managing AI agent tool contexts."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "iar3-r8", email = "dev@iar3-r8.io"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "import-linter",
]

[project.scripts]
tswap = "tool_swap.__main__:main"

[tool.hatch.build]
packages = ["src/tool_swap"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "A", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
