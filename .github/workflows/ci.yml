name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          # Install tool-swap-runtime in editable mode so tests can import it.
          pip install -e "src/tool_swap_runtime"

      - name: Run lint
        run: make lint

      - name: Run import-linter
        # Use python -c to invoke lint_imports_command directly since
        # the entry point script may not be on PATH in GitHub Actions.
        run: python -c "from importlinter.cli import lint_imports_command; lint_imports_command()"

      - name: Run tests
        run: make test
