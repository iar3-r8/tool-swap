name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          # Install tool-swap-runtime in editable mode so tests can import it.
          pip install -e "src/tool_swap_runtime"

      - name: Run lint
        run: make lint

      - name: Run import-linter
        # lint-imports is installed in .venv; use the venv python to invoke it.
        run: .venv/bin/lint-imports

      - name: Run tests
        run: make test
