[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-swap-runtime"
version = "0.1.0"
description = "Runtime distribution for tool-swap: backend execution environment."
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "iar3-r8", email = "dev@iar3-r8.io"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[tool.hatch.build]
packages = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "A", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
