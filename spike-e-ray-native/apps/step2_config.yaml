# Step 2 — App builder with baked-in weights.
# Two applications, same import_path, different args.
# Ray's own documented multi-model pattern.
#
# Each application has a unique route_prefix so the ServeDeploySchema
# uniqueness validator does not reject the pair.
#
# NOTE: image_uri is set here, so this config tests the builder pattern
# AND per-image isolation. The podman restriction that applied in the
# dev container (cannot clone: Operation not permitted) no longer holds
# on the host, where podman works and image_uri containers can start.

applications:
  - name: step2_torch
    import_path: step2_builder:build
    route_prefix: /torch
    args:
      weights_path: /opt/spike/weights/ckpt.bin
      framework: torch
      vram_mb: 4096
      image_uri: "${SPIKE_IMAGE_TORCH_URI:tool_torch:spike}"

  - name: step2_tf
    import_path: step2_builder:build
    route_prefix: /tf
    args:
      weights_path: /opt/spike/weights/ckpt.bin
      framework: tensorflow
      vram_mb: 4096
      image_uri: "${SPIKE_IMAGE_TF_URI:tool_tf:spike}"
