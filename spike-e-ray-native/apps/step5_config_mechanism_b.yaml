# Step 5 — Mechanism B: Declarative config re-apply.
# Same as mechanism A but without external_scaler_enabled.
# Replicas are controlled by sending the full config with flipped counts.
# This is applied dynamically by step5_alternate.py, not via serve deploy.
#
# D9 fix: ServeApplicationSchema (ray/serve/schema.py:712) defines neither
# ray_actor_options nor autoscaling_config at the application level, and sets
# no extra="forbid", so pydantic's extra="ignore" silently discarded the old
# application-level keys — mechanism B "worked" while changing nothing (a false
# step-5 result). Replica/scale keys now live in the deployments list, where
# DeploymentSchema (schema.py:309) actually reads them.
#
# autoscaling_config is set to null at the deployment level on purpose: the
# @serve.deployment decorator in step3_gpu_swap_container.py sets an
# autoscaling_config that survives the config merge (application_state.py:1942),
# and the controller then drives the replica count from the autoscaler
# (deployment_state.py:3550), ignoring the YAML num_replicas. Nulling it makes
# num_replicas authoritative. (Deployment-level autoscaling_config IS a valid
# key per DeploymentSchema, schema.py:356 — verified from source, not memory.)
#
# CAVEAT (reported): num_replicas cannot be 0 in the schema (PositiveInt), so
# this committed template cannot express the "off" (0) state. The mechanism-B
# loop (a stub in step5_alternate.py) must handle bringing a tool to 0. See the
# item-8 report.
#
# D34: the replicas must actually hold a GPU. The legacy `container`
# runtime_env key (step3_gpu_swap_container.py) is used, NOT `image_uri`,
# because `image_uri` hardcodes an empty run_options
# (ray/_private/runtime_env/image_uri.py:174) and therefore cannot pass the
# nvidia-container-runtime that injects the device nodes and driver libraries
# on this host (ledger 9L).
#
# D32: the container runtime_env MUST be repeated inside each deployment's
# ray_actor_options below — when a config sets ray_actor_options it REPLACES
# the decorator's ray_actor_options wholesale (application_state.py:1827-1833).
#
# D26: image names are written literally — no env-var placeholders
# (serve_api._assert_no_unexpanded_placeholders rejects the dollar-brace
# sequence anywhere in the rendered config, comments included).

applications:
  - name: step5_torch
    import_path: step3_gpu_swap_container:application_torch
    route_prefix: /tool_torch
    deployments:
      - name: ToolTorch
        num_replicas: 1
        autoscaling_config: null
        ray_actor_options:
          num_gpus: 1
          runtime_env:
            container:
              image: "tool_torch:spike"
              run_options:
                - "--runtime=/usr/bin/nvidia-container-runtime"
                - "--env=NVIDIA_VISIBLE_DEVICES=0"
                - "--env=NVIDIA_DRIVER_CAPABILITIES=compute,utility"

  - name: step5_tf
    import_path: step3_gpu_swap_container:application_tf
    route_prefix: /tool_tf
    deployments:
      - name: ToolTf
        num_replicas: 1
        autoscaling_config: null
        ray_actor_options:
          num_gpus: 1
          runtime_env:
            container:
              image: "tool_tf:spike"
              run_options:
                - "--runtime=/usr/bin/nvidia-container-runtime"
                - "--env=NVIDIA_VISIBLE_DEVICES=0"
                - "--env=NVIDIA_DRIVER_CAPABILITIES=compute,utility"
