# Step 6 — Restart and recovery.
# Same config shape as step 3 — we deploy it, kill the head node, then
# restart and see if it recovers.
#
# deployment-level keys (num_gpus, autoscaling_config) MUST be
# inside the deployments list.
#
# D34: the replicas must actually hold a GPU. The legacy `container`
# runtime_env key (step3_gpu_swap_container.py) is used, NOT `image_uri`,
# because `image_uri` hardcodes an empty run_options
# (ray/_private/runtime_env/image_uri.py:174) and therefore cannot pass the
# nvidia-container-runtime that injects the device nodes and driver libraries
# on this host (ledger 9L). Through image_uri the same replicas restarted
# with zero VRAM held (step 3's first two runs).
#
# D32: the container runtime_env MUST be repeated inside each deployment's
# ray_actor_options below. When a config sets ray_actor_options it REPLACES
# the @serve.deployment decorator's ray_actor_options wholesale — Ray performs
# no merge (ray/serve/_private/application_state.py:1827-1833). Omitting it
# here silently dropped the decorator's runtime_env and the replica ran on the
# host with no container (FileNotFoundError on the fixture weights path). Do
# not "tidy" it away.
#
# D26: image names are written literally — no env-var placeholders
# (serve_api._assert_no_unexpanded_placeholders rejects the dollar-brace
# sequence anywhere in the rendered config, comments included).
#
# `container` mutual exclusivity: it permits only `config` and `env_vars`
# alongside it (ray/runtime_env/runtime_env.py:397-404). Serve itself
# injects env_vars (deployment context vars,
# ray/serve/_private/deployment_state.py:130-148), so the key set is exactly
# {container, env_vars} and passes validation.

applications:
  # Explicit route_prefixes: two applications both defaulting to "/" are
  # rejected by ServeDeploySchema ("duplicate applications for route
  # prefix '/'").
  - name: tool_torch
    route_prefix: /tool_torch
    import_path: step3_gpu_swap_container:application_torch
    deployments:
      - name: ToolTorch
        ray_actor_options:
          num_gpus: 1
          runtime_env:
            container:
              image: "tool_torch:spike"
              run_options:
                - "--runtime=/usr/bin/nvidia-container-runtime"
                - "--env=NVIDIA_VISIBLE_DEVICES=0"
                - "--env=NVIDIA_DRIVER_CAPABILITIES=compute,utility"
        autoscaling_config:
          min_replicas: 0
          max_replicas: 1
          downscale_to_zero_delay_s: 60

  - name: tool_tf
    route_prefix: /tool_tf
    import_path: step3_gpu_swap_container:application_tf
    deployments:
      - name: ToolTf
        ray_actor_options:
          num_gpus: 1
          runtime_env:
            container:
              image: "tool_tf:spike"
              run_options:
                - "--runtime=/usr/bin/nvidia-container-runtime"
                - "--env=NVIDIA_VISIBLE_DEVICES=0"
                - "--env=NVIDIA_DRIVER_CAPABILITIES=compute,utility"
        autoscaling_config:
          min_replicas: 0
          max_replicas: 1
          downscale_to_zero_delay_s: 60
