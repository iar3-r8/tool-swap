# Step 6 — Restart and recovery.
# Same config as step 3 — we deploy it, kill the head node, then
# restart and see if it recovers.
#
# deployment-level keys (num_gpus, autoscaling_config) MUST be
# inside the deployments list.
#
# D32: image_uri MUST be repeated inside each deployment's
# ray_actor_options below. When a config sets ray_actor_options it
# REPLACES the @serve.deployment decorator's ray_actor_options
# wholesale — Ray performs no merge
# (ray/serve/_private/application_state.py:1827-1833). Omitting
# image_uri here silently dropped the decorator's
# runtime_env.image_uri and the replica ran on the host with no
# container (FileNotFoundError on the fixture weights path). Do not
# "tidy" it away.

applications:
  # Explicit route_prefixes: two applications both defaulting to "/" are
  # rejected by ServeDeploySchema ("duplicate applications for route
  # prefix '/'").
  - name: tool_torch
    route_prefix: /tool_torch
    import_path: step3_gpu_swap:application_torch
    deployments:
      - name: ToolTorch
        ray_actor_options:
          num_gpus: 1
          runtime_env:
            image_uri: "tool_torch:spike"
        autoscaling_config:
          min_replicas: 0
          max_replicas: 1
          downscale_to_zero_delay_s: 60

  - name: tool_tf
    route_prefix: /tool_tf
    import_path: step3_gpu_swap:application_tf
    deployments:
      - name: ToolTf
        ray_actor_options:
          num_gpus: 1
          runtime_env:
            image_uri: "tool_tf:spike"
        autoscaling_config:
          min_replicas: 0
          max_replicas: 1
          downscale_to_zero_delay_s: 60
